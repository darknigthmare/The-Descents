name: Native v0.5 cinematic and inspection review

on:
  push:
    branches: [feat/live-tower-collapse]
    paths:
      - '.review/v0.5/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tower-descent-cinematic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/feat/live-tower-collapse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ARCHIVE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out exactly the source revision under review
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify the explicitly requested frozen runtime
        run: python3 tools/capture_evidence.py check-request --request .review/v0.5/request.json
      - name: Prepare the graphical review runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libgl1 libxinerama1 libxcursor1 libxi6 libxrandr2
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_ARCHIVE_URL"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/tower-captures"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BINARY=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import the actual project resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BINARY" --version
          timeout 180s "$GODOT_BINARY" --headless --path prototype --editor --import --quit
      - name: Render native frontend and in-game introduction states
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s xvfb-run -a -s "-screen 0 1440x900x24" "$GODOT_BINARY" --path prototype --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 1440x900 res://tests/visual_frontend_preview.tscn -- --capture-root="$RUNNER_TEMP/tower-captures" 2>&1 | tee "$RUNNER_TEMP/cinematic-review.log"
      - name: Verify capture completeness and write provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/capture_evidence.py verify --request .review/v0.5/request.json --capture-root "$RUNNER_TEMP/tower-captures" --log "$RUNNER_TEMP/cinematic-review.log"
      - name: Preserve screenshots and logs as an independent review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tower-descent-v05-cinematic-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tower-captures/
            ${{ runner.temp }}/cinematic-review.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Commit captures only if the reviewed branch has not advanced
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/feat/live-tower-collapse | cut -f1)"
          if [ "$current" != "$expected" ]; then
            echo 'The branch advanced; captures remain available in the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          mkdir -p docs/captures/v0.5
          cp "$RUNNER_TEMP/tower-captures/"* docs/captures/v0.5/
          git add -- docs/captures/v0.5
          if git diff --cached --quiet; then
            echo 'The verified captures are already present.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture native v0.5 arrival, field inspections and frontend for visual review'
          if git push origin HEAD:refs/heads/feat/live-tower-collapse; then
            echo 'Native captures committed on the reviewed branch; manual visual review is still required.' >> "$GITHUB_STEP_SUMMARY"
          else
            current="$(git ls-remote origin refs/heads/feat/live-tower-collapse | cut -f1)"
            if [ "$current" != "$expected" ]; then
              echo 'The branch changed during publication; no overwrite occurred. Use the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'Capture publication failed while the reviewed branch remained unchanged.' >&2
            exit 1
          fi

