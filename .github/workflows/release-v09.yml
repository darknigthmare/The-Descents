name: Build and review The Tower Descent v0.9

on:
  push:
    branches: [feat/live-tower-collapse]
    paths:
      - '.review/v0.9/build-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tower-descent-v09-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feat/live-tower-collapse'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_ARCHIVE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out the explicit request and its frozen source parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate the separate request commit
        run: /usr/bin/python3 tools/build_release_ci.py guard

      - name: Install the native renderer and document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1-mesa-dri libgl1 libxinerama1 libxcursor1 libxi6 libxrandr2 \
            libreoffice-writer poppler-utils python3-docx python3-pil fontconfig \
            fonts-liberation fonts-dejavu-core fonts-crosextra-carlito
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_ARCHIVE_URL"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BINARY=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Validate, export and render the frozen candidate or verify its approved release
        run: /usr/bin/python3 tools/build_release_ci.py build --godot "$GODOT_BINARY"

      - name: Preserve generated evidence and platform files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tower-descent-v09-${{ github.sha }}
          path: |
            docs/validation/v0.9/
            docs/captures/v0.9/
            docs/The-Tower-Descent-Bible-v0.9.docx
            docs/The-Tower-Descent-Bible-v0.9.pdf
            builds/windows/TheTowerDescent.exe
            builds/web/
            releases/The-Tower-Descent-v0.9-Windows-x64.zip
            releases/The-Tower-Descent-v0.9-Sources.zip
            releases/VERIFICATION_V0.9.json
            .review/v0.9/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Publish generated files only while the requested source is still the branch head
        if: success()
        run: /usr/bin/python3 tools/build_release_ci.py publish
